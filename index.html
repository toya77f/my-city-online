<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>My City Online</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <!-- =================================================
       GAME
  ================================================== -->

  <div id="game"></div>


  <!-- =================================================
       START SCREEN
  ================================================== -->

  <div id="startScreen">

    <h1 id="gameTitle">
      MY CITY
    </h1>

    <div id="gameSubtitle">
      Explore the city with your friends
    </div>

    <button id="startButton">
      START GAME
    </button>

  </div>


  <!-- =================================================
       HUD
  ================================================== -->

  <div id="hud">

    <div id="topBar">

      <div class="hudBox">
        ❤️ 100
      </div>

      <div class="hudBox">
        💰 0
      </div>

    </div>


    <div id="location">
      📍 City
    </div>


    <div id="mission">
      Explore the city
    </div>

  </div>


  <!-- =================================================
       MAP BUTTON
  ================================================== -->

  <button id="mapButton">
    🗺️
  </button>


  <!-- =================================================
       MAP SCREEN
  ================================================== -->

  <div id="mapScreen">

    <div id="mapContainer">

      <button id="closeMap">
        ✕
      </button>


      <div id="cityMap">

        <!-- ROADS -->

        <div
          class="mapRoad horizontal"
          style="top: 44%;"
        ></div>

        <div
          class="mapRoad vertical"
          style="left: 44%;"
        ></div>


        <!-- PLACES -->

        <div
          id="mapHouse"
          class="mapPlace"
        >
          🏠 بيتك
        </div>


        <div
          id="mapSchool"
          class="mapPlace"
        >
          🏫 المدرسة
        </div>


        <div
          id="mapMall"
          class="mapPlace"
        >
          🛍️ المول
        </div>


        <div
          id="mapShop"
          class="mapPlace"
        >
          🏪 المحلات
        </div>


        <!-- PLAYERS -->

        <div id="mapPlayer"></div>

        <div id="mapFriend"></div>

      </div>

    </div>

  </div>


  <!-- =================================================
       JOYSTICK
  ================================================== -->

  <div id="joystick">

    <div id="joystickBase"></div>

    <div id="joystickStick"></div>

  </div>


  <!-- =================================================
       ACTION BUTTONS
  ================================================== -->

  <div id="actionButtons">

    <button
      id="jumpButton"
      class="actionButton"
    >
      ↑
    </button>


    <button
      id="actionButton"
      class="actionButton"
    >
      E
    </button>


    <button
      id="sprintButton"
      class="actionButton"
    >
      🏃
    </button>

  </div>


  <!-- =================================================
       MESSAGE
  ================================================== -->

  <div id="message">
    Welcome to My City
  </div>


  <!-- =================================================
       GAME SCRIPT
  ================================================== -->

  <script type="module">

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


    window.THREE = THREE;

    const script =
      document.createElement("script");

    script.type = "module";

    script.src = "game.js";

    document.body.appendChild(script);

  </script>


</body>

</html>
